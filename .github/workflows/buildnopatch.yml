name: Build IPA (NO PATCH)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "branch to build from"
        default: "Master"
        required: true
        type: string
      ipa_url:
        description: "url to a decrypted spotify ipa (optional, ipa build is skipped if empty)"
        default: ""
        required: false
        type: string
      tweak_url:
        description: "url to the eeveespotify tweak file (skips theos build if provided)"
        default: ""
        required: false
        type: string
      use_alt_name:
        description: "testflight?"
        default: false
        required: true
        type: boolean
      upload_to_alt_repo:
        description: "multi upload"
        default: false
        required: true
        type: boolean
      upload_to_telegram:
        description: "upload to telegram channel"
        default: false
        required: true
        type: boolean
      changelog_changer:
        description: "chuds. all of u."
        default: ""
        required: false
        type: string

env:
  THEOS: ${{ github.workspace }}/theos
  SWIFTPROTOBUF_VERSION: "1.29.0"

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          submodules: recursive

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2.0'
          
      - name: get current time for build date
        id: time
        run: |
          echo "timestamp=$(date +'%Y-%m-%d-%H-%M-%S')" >> $GITHUB_OUTPUT
          
      - name: set filename prefix
        run: |
          if [ "${{ inputs.use_alt_name }}" = "true" ]; then
            echo "FILE_PREFIX=TestFlight-ES" >> $GITHUB_ENV
          else
            echo "FILE_PREFIX=EeveeSpotify" >> $GITHUB_ENV
          fi

      - name: Setup Theos
        if: ${{ inputs.tweak_url == '' }}
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: ${{ github.workspace }}/theos
          submodules: recursive

      - name: Install build tools
        run: |
          brew install make dpkg ldid wget
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          python3 -m pip install --upgrade --break-system-packages \
              git+https://github.com/asdfzxcvbn/pyzule-rw.git
          ARCH=$(uname -m); [ "$ARCH" = "x86_64" ] && SUFFIX=macos-amd64 || SUFFIX=macos-arm64
          sudo curl -fsSL "https://github.com/asdfzxcvbn/ipapatch/releases/latest/download/ipapatch.${SUFFIX}" \
              -o /usr/local/bin/ipapatch
          sudo chmod +x /usr/local/bin/ipapatch
          ipapatch --help >/dev/null

      - name: Build EeveeSwiftProtobuf.framework from source
        if: ${{ inputs.tweak_url == '' }}
        env:
          SWIFTPROTOBUF_VERSION: ${{ env.SWIFTPROTOBUF_VERSION }}
        run: |
          chmod +x Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh
          Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh

      - name: Build .deb (rootless)
        if: ${{ inputs.tweak_url == '' }}
        env:
          REPO_SLUG: ${{ github.repository }}
        run: |
          THEOS_PACKAGE_SCHEME=rootless make package FINALPACKAGE=1
          DEB_PATH=$(find packages -name "com.eevee.spotify_*.deb" | head -1)
          [ -n "$DEB_PATH" ] || { echo "deb not produced" >&2; exit 1; }
          echo "DEB_PATH=$DEB_PATH"   >> $GITHUB_ENV
          echo "DEB_NAME=$(basename "$DEB_PATH")" >> $GITHUB_ENV

      - name: Fetch tweak from url
        if: ${{ inputs.tweak_url != '' }}
        run: |
          wget "${{ inputs.tweak_url }}" --no-verbose -O ${{ github.workspace }}/eeveespotify.deb
          echo "DEB_PATH=${{ github.workspace }}/eeveespotify.deb" >> $GITHUB_ENV
          echo "DEB_NAME=eeveespotify.deb" >> $GITHUB_ENV

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DEB_NAME }}
          path: ${{ env.DEB_PATH }}
          if-no-files-found: error

      - name: Validate vanilla IPA
        if: ${{ inputs.ipa_url != '' }}
        run: |
          wget "${{ inputs.ipa_url }}" --no-verbose -O ${{ github.workspace }}/spotify.ipa
          file_type=$(file --mime-type -b ${{ github.workspace }}/spotify.ipa)
          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::Not a valid IPA: $file_type"
            exit 1
          fi

      - name: Fetch OpenSpotifySafariExtension.appex
        if: ${{ inputs.ipa_url != '' }}
        run: |
          EXT_DIR="$RUNNER_TEMP/OpenSpotifySafariExtension"
          rm -rf "$EXT_DIR"
          git clone --depth 1 https://github.com/BillyCurtis/OpenSpotifySafariExtension.git "$EXT_DIR"
          EXT_SRC="$EXT_DIR/OpenSpotifySafariExtension.appex"
          [ -e "$EXT_SRC" ] || { echo "OpenSpotifySafariExtension.appex not found in repo" >&2; exit 1; }
          echo "OPENSPOTIFY_APPEX=$EXT_SRC" >> $GITHUB_ENV

      - name: Inject deb + framework into IPA (cyan)
        if: ${{ inputs.ipa_url != '' }}
        run: |
          mkdir -p Outputs/IPAS
          DEB_EXTRACT="$RUNNER_TEMP/deb-extract"
          mkdir -p "$DEB_EXTRACT"
          dpkg-deb -R "$DEB_PATH" "$DEB_EXTRACT"

          DYLIB_SRC=$(find "$DEB_EXTRACT" -name 'EeveeSpotify.dylib' | head -1)
          BUNDLE_SRC=$(find "$DEB_EXTRACT" -type d -name 'EeveeSpotify.bundle' | head -1)
          FRAMEWORK_SRC=$(find "$DEB_EXTRACT" -type d -name 'EeveeSwiftProtobuf.framework' | head -1)

          SPOT_VERSION=$(unzip -p ${{ github.workspace }}/spotify.ipa 'Payload/Spotify.app/Info.plist' \
              | plutil -extract CFBundleShortVersionString raw - 2>/dev/null || echo "unknown")
              
          if [ -f "$DEB_EXTRACT/control" ]; then
            EEVEE_VERSION=$(grep -E '^Version:' "$DEB_EXTRACT/control" | awk '{print $2}')
          else
            EEVEE_VERSION=$(grep -E '^Version:' "$DEB_EXTRACT/DEBIAN/control" | awk '{print $2}')
          fi
          
          OUT="Outputs/IPAS/${{ env.FILE_PREFIX }}-${SPOT_VERSION}-ESR-${EEVEE_VERSION}.ipa"

          echo "SPOTIFY_VERSION=$SPOT_VERSION" >> $GITHUB_ENV
          echo "TWEAK_VERSION=$EEVEE_VERSION" >> $GITHUB_ENV

          INJECT=("$DYLIB_SRC")
          [ -n "$FRAMEWORK_SRC" ] && INJECT+=("$FRAMEWORK_SRC")
          [ -n "$BUNDLE_SRC" ]    && INJECT+=("$BUNDLE_SRC")

          cyan -i ${{ github.workspace }}/spotify.ipa -o "$OUT" \
               -f "${INJECT[@]}" -c 9 -m 15.0 -du
          echo "OUT_IPA=$OUT" >> $GITHUB_ENV

      - name: Strip incompatible bundles
        if: ${{ inputs.ipa_url != '' }}
        run: |
          chmod +x Tools/strip-ipa.sh
          Tools/strip-ipa.sh "$OUT_IPA"

      - name: Add OpenSpotifySafariExtension.appex
        if: ${{ inputs.ipa_url != '' }}
        run: |
          cd "$(dirname "$OUT_IPA")"
          rm -rf Payload
          unzip -q "$(basename "$OUT_IPA")"

          mkdir -p "Payload/Spotify.app/Plugins"
          cp -R "$OPENSPOTIFY_APPEX" "Payload/Spotify.app/Plugins/OpenSpotifySafariExtension.appex"

          rm -f "$(basename "$OUT_IPA")"
          zip -qry "$(basename "$OUT_IPA")" Payload
          rm -rf Payload

      - name: Stage alternate app icons
        if: ${{ inputs.ipa_url != '' }}
        run: |
          chmod +x Tools/alt-icons.sh
          Tools/alt-icons.sh "$OUT_IPA"

      - name: Fetch original changelog and append warning
        if: ${{ inputs.ipa_url != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat << 'EOF' > changelog.txt
          # this might not be the latest changelog for the tweak version!
          
          * this only grabs from releases/latest as there is no changelog in actions. to check if it is newer than the release, go to commits in the original repo @ [GitHub](https://github.com/jaydenjcpy/EeveeSpotifyReincarnated) :P
          ---
          ### original changelog:
          
          EOF
          gh release view --repo jaydenjcpy/EeveeSpotifyReincarnated --json body -q .body >> changelog.txt || true

      - name: Upload IPA artifact
        if: ${{ inputs.ipa_url != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: EeveeSpotify-IPA
          path: ${{ env.OUT_IPA }}
          if-no-files-found: error

      - name: Upload to GitHub Releases
        if: ${{ inputs.ipa_url != '' }}
        uses: softprops/action-gh-release@v3.0.0
        with:
          body_path: changelog.txt
          tag_name: ${{ env.TWEAK_VERSION }}-${{ steps.time.outputs.timestamp }}
          name: Spotify v${{ env.SPOTIFY_VERSION }} (Prefix ${{ env.FILE_PREFIX }}) // Tweak v${{ env.TWEAK_VERSION }} // Build Timestamp ${{ steps.time.outputs.timestamp }}
          files: |
            ${{ env.OUT_IPA }}

      - name: Upload to EeveeIPA Releases
        if: ${{ inputs.ipa_url != '' && inputs.upload_to_alt_repo == true }}
        uses: softprops/action-gh-release@v3.0.0
        with:
          repository: 'estrogencat/EeveeIPA'
          token: ${{ secrets.ALT_REPO_TOKEN }}
          body_path: changelog.txt
          tag_name: ${{ env.SPOTIFY_VERSION }}-${{ env.TWEAK_VERSION }}-${{ steps.time.outputs.timestamp }}
          name: ${{ env.SPOTIFY_VERSION }} // Swift ${{ env.TWEAK_VERSION }} // Multi Upload from github.repository
          files: |
            ${{ env.OUT_IPA }}

      - name: Install pip packages for Telegram upload
        if: ${{ inputs.ipa_url != '' && inputs.upload_to_telegram == true }}
        run: pip3 install telethon cryptg FastTelethonhelper --break-system-packages

      - name: Override changelog for telegram
        if: ${{ inputs.ipa_url != '' && inputs.changelog_changer != '' }}
        env:
          CUSTOM_LOG: ${{ inputs.changelog_changer }}
        run: |
          echo "$CUSTOM_LOG" > changelog.txt

      - name: upload big files to telegram
        if: ${{ inputs.ipa_url != '' && inputs.upload_to_telegram == true }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          REGULAR_IPA: "${{ env.OUT_IPA }}"
          FILE_PREFIX: "${{ env.FILE_PREFIX }}"
          CAPTION: |
            ${{ env.FILE_PREFIX }} // Spotify v${{ env.SPOTIFY_VERSION }} // ESR v${{ env.TWEAK_VERSION }}
        run: |
          cat << 'EOF' > upload.py
          import os, asyncio, re
          from telethon import TelegramClient
          from FastTelethonhelper import fast_upload

          api_id = int(os.environ['TG_API_ID'])
          api_hash = os.environ['TG_API_HASH']
          bot_token = os.environ['TG_BOT_TOKEN']
          chat_id = os.environ['TG_CHAT_ID']
          
          if chat_id.lstrip('-').isdigit():
              chat_id = int(chat_id)

          async def main():
              client = await TelegramClient('bot_session', api_id, api_hash).start(bot_token=bot_token)
              
              with open('changelog.txt', 'r', encoding='utf-8') as f:
                  changelog_text = f.read()

              changelog_text = re.sub(r'^(#+)\s+(.+)$', r'**\2**', changelog_text, flags=re.MULTILINE)
                   
              full_caption = os.environ['CAPTION'] + "\n\n" + changelog_text
              if len(full_caption) > 1024:
                  full_caption = full_caption[:1020] + "..."
              
              print("zooming regular ipa to telegram with multiple connections... >w<")
              reg_file = await fast_upload(client, os.environ['REGULAR_IPA'])
              
              print("bundling it up and sending to the channel! :3")
              await client.send_file(chat_id, reg_file, caption=full_caption)
              await client.disconnect()

          asyncio.run(main())
          EOF
          
          python3 upload.py

      - name: Output success for telegram channel
        if: ${{ inputs.ipa_url != '' && inputs.upload_to_telegram == true }}
        run: |
          echo "im done bitch ass, check telegram"
