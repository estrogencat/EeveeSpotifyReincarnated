name: Update AltStore repository

on:
  repository_dispatch:
    types: [pingpongmotherfucker]
  workflow_dispatch:
  schedule:
    - cron: '0 0/6 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: Master

      - name: install jq
        run: sudo apt-get install jq -y

      - name: rebuild app-repo.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail

          EXPECTED="com.spotify.client com.spotify.client.patched com.spotify.client.tf com.spotify.client.tfp com.spotify.client.lg com.spotify.client.lgpatched"
          for bid in $EXPECTED; do
            if [ "$(jq --arg b "$bid" '[.apps[] | select(.bundleIdentifier == $b)] | length' app-repo.json)" != "1" ]; then
              echo "::error::app-repo.json does not contain exactly one app with bundleIdentifier $bid"
              exit 1
            fi
          done

          cp app-repo.json backup-repo.json
          jq '.apps[].versions = []' app-repo.json > tmp.json && mv tmp.json app-repo.json

          gh api "repos/estrogencat/EeveeIPA/releases?per_page=100" > releases.json

          ASSETS=$(jq -r 'reverse | .[] | .published_at as $date | .assets[]? | "\($date)|\(.name)|\(.browser_download_url)|\(.size)"' releases.json)

          if [ -z "$ASSETS" ]; then
            echo "no assets found! skipping..."
            exit 0
          fi

          if [[ -f "build_testflight" && -s "build_testflight" ]]; then
            PACKED_TESTFLIGHT=$(tr -d '[:space:]' < build_testflight)
          else
            PACKED_TESTFLIGHT=""
          fi

          if [[ -f "build" && -s "build" ]]; then
            PACKED_STABLE=$(tr -d '[:space:]' < build)
          else
            PACKED_STABLE=""
          fi

          echo "build_testflight -> ${PACKED_TESTFLIGHT:-<not found, will fall back>}"
          echo "build            -> ${PACKED_STABLE:-<not found, will fall back>}"

          echo "$ASSETS" | while IFS='|' read -r DATE NAME URL SIZE; do
            if [[ "$NAME" != *".ipa" ]]; then
              continue
            fi

            BUNDLE=""
            MINOS="16.0"
            IS_TF=false

            if [[ "$NAME" =~ TestFlight-ES-([0-9.]+) ]]; then
              VERSION="${BASH_REMATCH[1]}"
              IS_TF=true
            elif [[ "$NAME" =~ EeveeSpotify-([0-9.]+) ]]; then
              VERSION="${BASH_REMATCH[1]}"
            else
              continue
            fi

            case "$NAME" in
              *-LG-patched.ipa)
                BUNDLE="com.spotify.client.lgpatched"; MINOS="26.0" ;;
              *-LG.ipa)
                BUNDLE="com.spotify.client.lg";        MINOS="26.0" ;;
              *-patched.ipa)
                if [ "$IS_TF" = true ]; then BUNDLE="com.spotify.client.tfp"; else BUNDLE="com.spotify.client.patched"; fi ;;
              *)
                if [ "$IS_TF" = true ]; then BUNDLE="com.spotify.client.tf"; else BUNDLE="com.spotify.client"; fi ;;
            esac

            BASE_VER=$(echo "$VERSION" | cut -d. -f1-3 | tr -d '.')

            if [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              V1="${BASH_REMATCH[1]}"
              V2="${BASH_REMATCH[2]}"
              V3="${BASH_REMATCH[3]}"
              V4="${BASH_REMATCH[4]}"
              V4_PADDED=$(printf "%05d" "$V4")
              FALLBACK_VER="${V1}${V2}${V3}${V4_PADDED}"
              IS_4_PART=true
            else
              RAW_VER="${VERSION//./}"
              PAD="${RAW_VER}000000000"
              FALLBACK_VER="${PAD:0:9}"
              IS_4_PART=false
            fi

            EXISTING_BUILD=$(jq -r --arg ver "$VERSION" --arg bid "$BUNDLE" \
              '(.apps[] | select(.bundleIdentifier == $bid) | .versions // [])[] | select(.version == $ver) | .buildVersion' \
              backup-repo.json | head -n 1)

            if [[ "$IS_4_PART" == true ]]; then
              BUILD_VER="$FALLBACK_VER"
            else
              if [[ "$IS_TF" == false && -n "$PACKED_STABLE" && "$PACKED_STABLE" == "$BASE_VER"* ]]; then
                BUILD_VER="$PACKED_STABLE"
              elif [[ "$IS_TF" == true && -n "$PACKED_TESTFLIGHT" && "$PACKED_TESTFLIGHT" == "$BASE_VER"* ]]; then
                BUILD_VER="$PACKED_TESTFLIGHT"
              elif [[ "$EXISTING_BUILD" =~ ^[0-9]{9}$ && "$EXISTING_BUILD" == "$BASE_VER"* ]]; then
                BUILD_VER="$EXISTING_BUILD"
              else
                BUILD_VER="$FALLBACK_VER"
              fi
            fi

            jq --arg ver "$VERSION" \
               --arg date "$DATE" \
               --arg url "$URL" \
               --argjson size "$SIZE" \
               --arg bid "$BUNDLE" \
               --arg build "$BUILD_VER" \
               --arg minOS "$MINOS" \
              '.apps |= map(
                 if .bundleIdentifier == $bid then
                   .versions |= (
                     {"version": $ver, "date": $date, "size": $size, "downloadURL": $url, "buildVersion": $build, "minOSVersion": $minOS} as $new
                     | if any(.[]; .version == $ver)
                       then map(if .version == $ver then $new else . end)
                       else . + [$new] end
                   )
                 else . end
               )' \
              app-repo.json > tmp.json && mv tmp.json app-repo.json
          done

          rm backup-repo.json releases.json

          jq '.apps[] |= del(.version, .versionDate, .downloadURL, .size)' \
            app-repo.json > tmp.json && mv tmp.json app-repo.json

          jq '.apps |= map(
            if (.versions | length) > 0 then
              .versions |= reverse
            else . end
          )' app-repo.json > tmp.json && mv tmp.json app-repo.json

          echo "--- result ---"
          jq -r '.apps[] | "\(.bundleIdentifier): \(.versions | length) versions, minOS \(.versions[0].minOSVersion // "-"), newest \(.versions[0].version // "-")"' app-repo.json

      - name: commit updated app-repo.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app-repo.json
          git diff --cached --quiet || git commit -m "chore: update app-repo.json [skip ci]"
          git push origin Master
