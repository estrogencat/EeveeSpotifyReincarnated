name: Update AltStore repository

on:
  repository_dispatch:
    types: [pingpongmotherfucker]
  workflow_dispatch:
  schedule:
    - cron: '0 0/6 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: Master

      - name: install dependencies
        run: sudo apt-get install -y jq unzip libplist-utils

      - name: rebuild app-repo.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. backup the current json to check for cached versions, then start fresh
          cp app-repo.json old-repo.json
          jq '.apps[].versions = []' app-repo.json > tmp.json && mv tmp.json app-repo.json

          # 2. fetch history from EeveeIPA
          gh api "repos/estrogencat/EeveeIPA/releases?per_page=100" > releases.json

          # 3. extract assets and reverse so oldest is processed first!
          ASSETS=$(jq -r 'reverse | .[] | .published_at as $date | .assets[]? | "\($date)|\(.name)|\(.browser_download_url)|\(.size)"' releases.json)

          if [ -z "$ASSETS" ]; then
            echo "no assets found! skipping..."
            exit 0
          fi

          # 4. loop and sort
          echo "$ASSETS" | while IFS='|' read -r DATE NAME URL SIZE; do
            if [[ "$NAME" != *".ipa" ]]; then
              continue
            fi

            APP_INDEX=-1
            if [[ "$NAME" =~ TestFlight-ES-([0-9.]+) ]]; then
              VERSION="${BASH_REMATCH[1]}"
              if [[ "$NAME" == *"-patched.ipa" ]]; then
                APP_INDEX=0
              else
                APP_INDEX=1
              fi
            elif [[ "$NAME" =~ EeveeSpotify-([0-9.]+) ]]; then
              VERSION="${BASH_REMATCH[1]}"
              if [[ "$NAME" == *"-patched.ipa" ]]; then
                APP_INDEX=2
              else
                APP_INDEX=3
              fi
            else
              continue
            fi

            if [[ "$APP_INDEX" -ne -1 ]]; then
              # grab cached build version so we don't download huge files pointlessly
              BUILD_VER=$(jq -r --arg ver "$VERSION" --argjson idx "$APP_INDEX" '.apps[$idx].versions[]? | select(.version == $ver) | .buildVersion // empty' old-repo.json)

              if [ -z "$BUILD_VER" ] || [ "$BUILD_VER" == "null" ]; then
                echo "downloading $NAME to extract buildVersion..."
                wget -q "$URL" -O temp.ipa
                unzip -p temp.ipa "Payload/*.app/Info.plist" > temp_info.plist || true
                
                BUILD_VER=""
                if [ -s temp_info.plist ]; then
                  # convert binary plist to xml
                  plistutil -i temp_info.plist -o temp_info.xml || cp temp_info.plist temp_info.xml
                  BUILD_VER=$(grep -A1 '<key>CFBundleVersion</key>' temp_info.xml | grep '<string>' | sed -E 's/.*<string>(.*)<\/string>.*/\1/' | head -n 1)
                fi
                
                rm -f temp.ipa temp_info.plist temp_info.xml
              fi

              # replace check! updates the version if it exists, otherwise appends it
              jq --arg ver "$VERSION" \
                 --arg date "$DATE" \
                 --arg url "$URL" \
                 --argjson size "$SIZE" \
                 --argjson idx "$APP_INDEX" \
                 --arg build "$BUILD_VER" \
                 --arg minOS "16.0" \
                '.apps[$idx].versions |= if any(.[]; .version == $ver) then map(if .version == $ver then {"version": $ver, "date": $date, "size": $size, "downloadURL": $url, "buildVersion": (if $build == "" then null else $build end), "minOSVersion": $minOS} else . end) else . + [{"version": $ver, "date": $date, "size": $size, "downloadURL": $url, "buildVersion": (if $build == "" then null else $build end), "minOSVersion": $minOS}] end' \
                app-repo.json > tmp.json && mv tmp.json app-repo.json
            fi
          done

          # 5. reverse the final array to be newest-first and sync top-level metadata
          jq '.apps |= map(
            if (.versions | length) > 0 then
              .versions |= reverse |
              .version = .versions[0].version |
              .versionDate = .versions[0].date |
              .downloadURL = .versions[0].downloadURL |
              .size = .versions[0].size
            else . end
          )' app-repo.json > tmp.json && mv tmp.json app-repo.json
          
          rm -f old-repo.json

      - name: commit updated app-repo.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app-repo.json
          git diff --cached --quiet || git commit -m "chore: update app-repo.json [skip ci]"
          git push origin Master
