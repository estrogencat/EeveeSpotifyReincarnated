name: Update AltStore repository
 
on:
  repository_dispatch:
    types: [pingpongmotherfucker]
  workflow_dispatch:
  schedule:
    - cron: '0 0/6 * * *'
 
permissions:
  contents: write
 
jobs:
  build:
    runs-on: ubuntu-latest
 
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: Master
 
      - name: install jq
        run: sudo apt-get install jq -y
 
      - name: rebuild app-repo.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. backup the repo to save existing 9-digit build numbers, then clear it!
          cp app-repo.json backup-repo.json
          jq '.apps[].versions = []' app-repo.json > tmp.json && mv tmp.json app-repo.json
 
          # 2. fetch history from EeveeIPA
          gh api "repos/estrogencat/EeveeIPA/releases?per_page=100" > releases.json
 
          # 3. extract assets and reverse so oldest is processed first!
          ASSETS=$(jq -r 'reverse | .[] | .published_at as $date | .assets[]? | "\($date)|\(.name)|\(.browser_download_url)|\(.size)"' releases.json)
 
          if [ -z "$ASSETS" ]; then
            echo "no assets found! skipping..."
            exit 0
          fi

          # ── read the real SpotifyVersionPacked values written by the build workflow ──
          if [[ -f "build_testflight" && -s "build_testflight" ]]; then
            PACKED_TESTFLIGHT=$(tr -d '[:space:]' < build_testflight)
          else
            PACKED_TESTFLIGHT=""
          fi

          if [[ -f "build" && -s "build" ]]; then
            PACKED_STABLE=$(tr -d '[:space:]' < build)
          else
            PACKED_STABLE=""
          fi

          echo "build_testflight -> ${PACKED_TESTFLIGHT:-<not found, will fall back>}"
          echo "build            -> ${PACKED_STABLE:-<not found, will fall back>}"
          # ─────────────────────────────────────────────────────────────────────
 
          # 4. loop and sort
          echo "$ASSETS" | while IFS='|' read -r DATE NAME URL SIZE; do
            if [[ "$NAME" != *".ipa" ]]; then
              continue
            fi
 
            APP_INDEX=-1
            if [[ "$NAME" =~ TestFlight-ES-([0-9.]+) ]]; then
              VERSION="${BASH_REMATCH[1]}"
              if [[ "$NAME" == *"-patched.ipa" ]]; then
                APP_INDEX=0
              else
                APP_INDEX=1
              fi
            elif [[ "$NAME" =~ EeveeSpotify-([0-9.]+) ]]; then
              VERSION="${BASH_REMATCH[1]}"
              if [[ "$NAME" == *"-patched.ipa" ]]; then
                APP_INDEX=2
              else
                APP_INDEX=3
              fi
            else
              continue
            fi
 
            if [[ "$APP_INDEX" -ne -1 ]]; then
              # calculate the base version for loose matching! (e.g. 9160)
              BASE_VER=$(echo "$VERSION" | cut -d. -f1-3 | tr -d '.')
              
              # ── Apple Math Generator for FALLBACK_VER! ──
              if [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                V1="${BASH_REMATCH[1]}"
                V2="${BASH_REMATCH[2]}"
                V3="${BASH_REMATCH[3]}"
                V4="${BASH_REMATCH[4]}"
                V4_PADDED=$(printf "%05d" "$V4")
                FALLBACK_VER="${V1}${V2}${V3}${V4_PADDED}"
                IS_4_PART=true
              else
                RAW_VER="${VERSION//./}"
                PAD="${RAW_VER}000000000"
                FALLBACK_VER="${PAD:0:9}"
                IS_4_PART=false
              fi
              # ────────────────────────────────────────────
              
              # grab the existing build version from our backup file (if it exists!)
              EXISTING_BUILD=$(jq -r --arg ver "$VERSION" --argjson idx "$APP_INDEX" '(.apps[$idx].versions // [])[] | select(.version == $ver) | .buildVersion' backup-repo.json | head -n 1)
              
              # ── intelligent build version assignment ──
              if [[ "$IS_4_PART" == true ]]; then
                # For 4-part versions (TestFlight), Apple Math EXACTLY generates the CFBundleVersion!
                # Bypassing the packed variables entirely makes cross-contamination impossible!
                BUILD_VER="$FALLBACK_VER"
              else
                # For 3-part versions (Stable), we MUST use the packed files or valid backups!
                if [[ "$APP_INDEX" -ge 2 && -n "$PACKED_STABLE" && "$PACKED_STABLE" == "$BASE_VER"* ]]; then
                  BUILD_VER="$PACKED_STABLE"
                elif [[ "$APP_INDEX" -le 1 && -n "$PACKED_TESTFLIGHT" && "$PACKED_TESTFLIGHT" == "$BASE_VER"* ]]; then
                  BUILD_VER="$PACKED_TESTFLIGHT"
                elif [[ "$EXISTING_BUILD" =~ ^[0-9]{9}$ && "$EXISTING_BUILD" == "$BASE_VER"* ]]; then
                  BUILD_VER="$EXISTING_BUILD"
                else
                  BUILD_VER="$FALLBACK_VER"
                fi
              fi
              # ──────────────────────────────────────────
              
              # replace check! updates the version if it exists, otherwise appends it
              jq --arg ver "$VERSION" \
                 --arg date "$DATE" \
                 --arg url "$URL" \
                 --argjson size "$SIZE" \
                 --argjson idx "$APP_INDEX" \
                 --arg build "$BUILD_VER" \
                 --arg minOS "16.0" \
                '.apps[$idx].versions |= if any(.[]; .version == $ver) then map(if .version == $ver then {"version": $ver, "date": $date, "size": $size, "downloadURL": $url, "buildVersion": $build, "minOSVersion": $minOS} else . end) else . + [{"version": $ver, "date": $date, "size": $size, "downloadURL": $url, "buildVersion": $build, "minOSVersion": $minOS}] end' \
                app-repo.json > tmp.json && mv tmp.json app-repo.json
            fi
          done
 
          # 5. cleanup and format! reverse the versions array to be newest-first
          rm backup-repo.json
          
          jq '.apps[] |= del(.version, .versionDate, .downloadURL, .size)' \
            app-repo.json > tmp.json && mv tmp.json app-repo.json
 
          jq '.apps |= map(
            if (.versions | length) > 0 then
              .versions |= reverse
            else . end
          )' app-repo.json > tmp.json && mv tmp.json app-repo.json
 
      - name: commit updated app-repo.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app-repo.json
          git diff --cached --quiet || git commit -m "chore: update app-repo.json [skip ci]"
          git push origin Master
